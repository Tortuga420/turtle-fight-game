<!DOCTYPE html>
<html>
<head>
    <title>Generate Turtle SVGs</title>
    <style>
        body { background: #333; padding: 20px; }
        .turtle { margin: 20px; }
    </style>
</head>
<body>
    <div id="turtles"></div>
    <script>
        const colors = {
            red: '#ff4444',
            blue: '#4444ff',
            green: '#44ff44',
            purple: '#aa44ff'
        };

        function generateTurtle(color) {
            const svg = `
                <svg width="60" height="60" viewBox="0 0 60 60" class="turtle">
                    <!-- Shell -->
                    <ellipse cx="30" cy="30" rx="25" ry="20" fill="#8B4513"/>
                    <!-- Body -->
                    <ellipse cx="30" cy="30" rx="20" ry="15" fill="${colors[color]}"/>
                    <!-- Head -->
                    <ellipse cx="45" cy="30" rx="10" ry="8" fill="${colors[color]}"/>
                    <!-- Eyes -->
                    <circle cx="50" cy="28" r="2" fill="white"/>
                    <circle cx="50" cy="32" r="2" fill="white"/>
                    <!-- Legs -->
                    <ellipse cx="20" cy="20" rx="8" ry="5" fill="${colors[color]}"/>
                    <ellipse cx="20" cy="40" rx="8" ry="5" fill="${colors[color]}"/>
                    <ellipse cx="40" cy="20" rx="8" ry="5" fill="${colors[color]}"/>
                    <ellipse cx="40" cy="40" rx="8" ry="5" fill="${colors[color]}"/>
                </svg>
            `;
            return svg;
        }

        const container = document.getElementById('turtles');
        Object.keys(colors).forEach(color => {
            const div = document.createElement('div');
            div.innerHTML = generateTurtle(color);
            container.appendChild(div);
            
            // Add download button
            const button = document.createElement('button');
            button.textContent = `Download ${color} turtle`;
            button.onclick = () => {
                const svg = div.querySelector('svg');
                const svgData = new XMLSerializer().serializeToString(svg);
                const blob = new Blob([svgData], {type: 'image/svg+xml'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${color}-turtle.svg`;
                a.click();
                URL.revokeObjectURL(url);
            };
            container.appendChild(button);
        });
    </script>
</body>
</html>
